name: daily-data

# 每天 22:48（北京时间）补齐缺失交易日的份额与行情，追加到 data/ 后提交。
# 提交会触发 EdgeOne 重新构建，不需要在这里部署。

on:
  schedule:
    # 22:48（北京时间）= 14:48 UTC。GitHub 的 cron 默认按 UTC，账号和仓库的
    # 时区设置都不影响它。21 点多上交所当日快照往往还没发布，所以定在 22:48；
    # 漏跑的日子由 daily.py 下次自动补齐所有缺的工作日。
    - cron: '48 14 * * 1-5'
  workflow_dispatch:
    inputs:
      date:
        description: '补跑指定日期 YYYY-MM-DD（留空 = 今天）'
        required: false
      backfill:
        description: '把每个序列缺的交易日都补上'
        type: boolean
        default: false

concurrency:
  group: daily-data
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          # 重跑旧 run 不会更新 head_sha，写死 ref 才能拿到最新 main；
          # fetch-depth 0 是为了 push 前的 rebase 有共同祖先，浅克隆会失败。
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: 抓数据
        id: fetch
        run: |
          set +e
          args=""
          if [ -n "${{ inputs.date }}" ]; then args="$args --date ${{ inputs.date }}"; fi
          if [ "${{ inputs.backfill }}" = "true" ]; then args="$args --backfill"; fi
          python3 daily.py $args
          rc=$?
          if [ $rc -eq 3 ]; then
            echo "没有新数据，正常退出"
            echo "no_new_data=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          exit $rc

      - name: 构建校验
        if: steps.fetch.outputs.no_new_data != 'true'
        run: npm ci --no-audit --no-fund && npm run build

      - name: 提交
        if: steps.fetch.outputs.no_new_data != 'true'
        run: |
          git add data/
          if git diff --cached --quiet; then
            echo "data/ 没有变化"
            exit 0
          fi
          git -c user.name='sharetrace-bot' \
              -c user.email='sharetrace-bot@users.noreply.github.com' \
              commit -m "数据更新 $(TZ=Asia/Shanghai date +%F)"
          # 抓数据的这几分钟里 main 可能又被推过，先 rebase 再推
          git pull --rebase origin main
          git push
