name: daily-data

# 补齐缺失交易日的份额与行情，追加到 data/ 后提交。
# 提交会触发 EdgeOne 重新构建，不需要在这里部署。

on:
  schedule:
    # 目标：北京时间每个交易日 09:18 左右真正跑起来（盘前、T-1 已定稿）。
    # 实测 GitHub 的 schedule 比 cron 写的时刻晚约 5 小时 47 分：
    #   cron 01:18 UTC（09:18 CST）→ 实际 10-29 07:04:50Z、10-30 07:05:42Z 才触发，
    #   两天只差 52 秒，说明这是个稳定偏移，不是随机排队。
    # 所以把 cron 往前挪同样的偏移：19:31 UTC（= 次日 03:31 CST）→ 延迟后落在 09:18 CST。
    # 要是哪天延迟消失，03:31 CST 跑也没问题：前一日份额前一晚 22:48 后已定稿。
    # 0-4 是 UTC 的周日到周四，对应 CST 周一到周五。
    - cron: '31 19 * * 0-4'
  workflow_dispatch:
    inputs:
      date:
        description: '补跑指定日期 YYYY-MM-DD（留空 = 自动补齐缺口）'
        required: false
      backfill:
        description: '把每个序列缺的交易日都补上'
        type: boolean
        default: false

concurrency:
  group: daily-data
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          # 重跑旧 run 不会更新 head_sha，写死 ref 才能拿到最新 main；
          # fetch-depth 0 是为了 push 前的 rebase 有共同祖先，浅克隆会失败。
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: 抓数据
        id: fetch
        run: |
          set +e
          args=""
          if [ -n "${{ inputs.date }}" ]; then args="$args --date ${{ inputs.date }}"; fi
          if [ "${{ inputs.backfill }}" = "true" ]; then args="$args --backfill"; fi
          python3 daily.py $args
          rc=$?
          if [ $rc -eq 3 ]; then
            echo "没有新数据，正常退出"
            echo "no_new_data=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          exit $rc

      - name: 构建校验
        if: steps.fetch.outputs.no_new_data != 'true'
        run: npm ci --no-audit --no-fund && npm run build

      - name: 提交
        if: steps.fetch.outputs.no_new_data != 'true'
        run: |
          git add data/
          if git diff --cached --quiet; then
            echo "data/ 没有变化"
            exit 0
          fi
          git -c user.name='sharetrace-bot' \
              -c user.email='sharetrace-bot@users.noreply.github.com' \
              commit -m "数据更新 $(TZ=Asia/Shanghai date +%F)"
          # 抓数据的这几分钟里 main 可能又被推过，先 rebase 再推
          git pull --rebase origin main
          git push
