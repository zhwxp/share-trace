name: probe-sources

# 只回答一个问题：GitHub Actions 的 runner 能不能访问这些行情/份额源。
# 不写数据、不提交、不部署。

on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/probe_sources.py'
      - '.github/workflows/probe-sources.yml'

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装 baostock
        run: pip install --quiet baostock

      - name: 探测各源
        env:
          HITHINK_API_KEY: ${{ secrets.HITHINK_API_KEY }}
        run: python3 tools/probe_sources.py
